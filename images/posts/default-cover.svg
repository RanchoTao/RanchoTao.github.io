<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Minimal abstract cover for research notes</title>
  <desc id="desc">A dark gradient canvas with subtle grid lines and concentric geometric shapes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="55%" stop-color="#172337"/>
      <stop offset="100%" stop-color="#0c1321"/>
    </linearGradient>
    <radialGradient id="light" cx="60%" cy="45%" r="56%">
      <stop offset="0%" stop-color="#526f98" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#526f98" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#c9dded" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#light)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <g fill="none" stroke="#b8cedf" stroke-width="2" stroke-opacity=".35">
    <circle cx="800" cy="450" r="180"/>
    <circle cx="800" cy="450" r="260" stroke-opacity=".2"/>
    <circle cx="800" cy="450" r="340" stroke-opacity=".12"/>
    <path d="M560 450H1040M800 210V690" stroke-opacity=".16"/>
  </g>
  <circle cx="800" cy="450" r="12" fill="#cee5fa" fill-opacity=".75"/>
</svg>
