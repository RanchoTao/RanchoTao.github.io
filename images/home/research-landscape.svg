<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" role="img" aria-labelledby="title desc">
  <title id="title">Abstract mathematics and artificial intelligence landscape</title>
  <desc id="desc">A dark blue research landscape with grids, trajectories, network nodes, contour lines, and a red directional arrow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.5" stop-color="#101a31"/>
      <stop offset="1" stop-color="#1a1028"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.67" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#3268d8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#3268d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.18" cy="0.78" r="0.58">
      <stop offset="0" stop-color="#12a5b8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#12a5b8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#b7c8ff" stroke-opacity="0.08" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.2" fill="#dbe7ff" fill-opacity="0.16"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1l10 5-10 5z" fill="#ef3340"/>
    </marker>
    <filter id="blur">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1920" height="1200" fill="url(#bg)"/>
  <rect width="1920" height="1200" fill="url(#glowA)"/>
  <rect width="1920" height="1200" fill="url(#glowB)"/>
  <rect width="1920" height="1200" fill="url(#grid)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M-80 955C210 725 300 1085 555 795S915 455 1190 625s405 215 805-10" stroke="#70a5ff" stroke-opacity="0.28" stroke-width="3"/>
    <path d="M-60 1015C230 820 400 1125 665 875s525-530 835-300 315 250 505 125" stroke="#8ce7ee" stroke-opacity="0.16" stroke-width="2"/>
    <path d="M120 320c310-260 510-135 710 50s385 120 585-70 330-215 590-70" stroke="#9eb7ff" stroke-opacity="0.17" stroke-width="2"/>
    <path d="M285 890c180-210 305-50 445-215s300-445 555-335 270 380 505 165" stroke="#ef3340" stroke-opacity="0.9" stroke-width="5" marker-end="url(#arrow)"/>
  </g>

  <g fill="none" stroke="#a7bbf0" stroke-opacity="0.11">
    <ellipse cx="1490" cy="805" rx="330" ry="175" stroke-width="2"/>
    <ellipse cx="1490" cy="805" rx="255" ry="130"/>
    <ellipse cx="1490" cy="805" rx="175" ry="88"/>
    <path d="M1165 805h650M1490 630v350"/>
  </g>

  <g stroke="#9fc0ff" stroke-opacity="0.25" stroke-width="1.5">
    <path d="M210 250l180 115 150-70 170 150 210-120 140 80"/>
    <path d="M390 365l-55 195 205 110 170-225 210 210 145-250"/>
    <path d="M540 295v375M710 445l-30 260M920 325v330"/>
  </g>

  <g fill="#d8e5ff">
    <circle cx="210" cy="250" r="6" fill-opacity="0.72"/>
    <circle cx="390" cy="365" r="7" fill-opacity="0.85"/>
    <circle cx="540" cy="295" r="5" fill-opacity="0.58"/>
    <circle cx="540" cy="670" r="8" fill-opacity="0.82"/>
    <circle cx="710" cy="445" r="9" fill="#7aa8ff" fill-opacity="0.86"/>
    <circle cx="680" cy="705" r="5" fill-opacity="0.54"/>
    <circle cx="920" cy="325" r="7" fill-opacity="0.75"/>
    <circle cx="920" cy="655" r="6" fill-opacity="0.62"/>
    <circle cx="1065" cy="405" r="5" fill="#8ce7ee" fill-opacity="0.78"/>
  </g>

  <g fill="#3268d8" fill-opacity="0.22" filter="url(#blur)">
    <circle cx="1210" cy="260" r="120"/>
    <circle cx="420" cy="890" r="150"/>
  </g>

  <g fill="#f7fbff" fill-opacity="0.36">
    <circle cx="1350" cy="270" r="2"/>
    <circle cx="1530" cy="210" r="2.4"/>
    <circle cx="1690" cy="355" r="1.8"/>
    <circle cx="1200" cy="450" r="1.6"/>
    <circle cx="1780" cy="510" r="2.2"/>
    <circle cx="1080" cy="920" r="2"/>
    <circle cx="860" cy="1030" r="1.7"/>
  </g>
</svg>
